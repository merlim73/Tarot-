<script>

/* =========================================================

const FALLBACK_VIDEOS = [

/* =========================================================
   ESTADO
========================================================= */

let currentVideos = cartomantesData.map((cart,index)=>({

    videoId:FALLBACK_VIDEOS[index],

    title:"Previsão Especial para Áries",

    loading:false,

    error:null

}));


const grid =
    document.getElementById("cartomantesGrid");


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function truncate(value,length){

    if(!value){
        return "Previsão para Áries";
    }

    value=String(value);

    return value.length > length
        ? value.substring(0,length)+"..."
        : value;

}


/* =========================================================
   VALIDAR ID YOUTUBE
========================================================= */

function validYouTubeId(id){

    return /^[a-zA-Z0-9_-]{11}$/.test(id);

}


/* =========================================================
   URL DO PLAYER
========================================================= */

function youtubeEmbedUrl(videoId){

    if(!validYouTubeId(videoId)){
        return "";
    }

    /*
       youtube-nocookie:
       modo de privacidade melhorado.

       playsinline:
       importante em dispositivos móveis.

       rel=0:
       evita recomendações de outros canais
       quando possível.

       controls=1:
       mantém os controlos normais.

       origin:
       NÃO colocamos localhost ou um domínio
       inventado porque a aplicação pode estar
       no GitHub ou dentro do Kodular.
    */

    return (
        "https://www.youtube-nocookie.com/embed/"
        + encodeURIComponent(videoId)
        + "?autoplay=0"
        + "&controls=1"
        + "&playsinline=1"
        + "&rel=0"
        + "&iv_load_policy=3"
    );

}


/* =========================================================
   URL YOUTUBE NORMAL
========================================================= */

function youtubeWatchUrl(videoId){

    if(!validYouTubeId(videoId)){
        return "#";
    }

    return "https://www.youtube.com/watch?v="
        + encodeURIComponent(videoId);

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderAllCards(){

    if(!grid){
        return;
    }

    let html="";

    for(let i=0;i<cartomantesData.length;i++){

        const cart=cartomantesData[i];

        const video=currentVideos[i];

        const videoId=video.videoId;

        const loading=video.loading;

        const title=video.title;

        const error=video.error;


        let player="";


        if(loading){

            player=`

                <div class="video-placeholder">

                    <div class="loader"></div>

                    <div>
                        🔥 A carregar vídeo...
                    </div>

                </div>

            `;

        }

        else if(validYouTubeId(videoId)){

            /*
               ESTA É A PARTE MAIS IMPORTANTE.

               iframe simples e compatível.

               NÃO existe:
               [URL](URL)

               NÃO existe:
               sandbox

               NÃO existe:
               API JavaScript obrigatória.

               Isto é muito mais estável
               no GitHub Pages e WebView.
            */

            const src=youtubeEmbedUrl(videoId);

            player=`

                <iframe
                    src="${src}"
                    title="${escapeHtml(cart.nome)} - YouTube"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            `;

        }

        else{

            player=`

                <div class="video-placeholder">

                    <div class="icon">🔮</div>

                    <div>
                        Vídeo indisponível
                    </div>

                </div>

            `;

        }


        html+=`

            <article
                class="card-cartomante"
                data-index="${i}">

                <div class="ranking-badge">
                    ${escapeHtml(cart.ranking)}
                    CARTOMANTE
                </div>


                <div class="card-header">

                    <div class="avatar-icon">
                        🔮
                    </div>


                    <div class="cartomante-info">

                        <div class="cartomante-nome">
                            ${escapeHtml(cart.nome)}
                        </div>


                        <div class="stats">

                            <span class="stat-item">
                                👥 ${escapeHtml(cart.seguidores)}
                            </span>

                            <span class="stat-item">
                                ${escapeHtml(cart.acertos)}
                            </span>

                            <span class="badge-acertos">
                                ${escapeHtml(cart.destaque)}
                            </span>

                        </div>

                    </div>

                </div>


                <div class="video-area">

                    <div class="youtube-embed">

                        ${player}

                    </div>


                    <div class="video-footer">

                        <div
                            class="info-update"
                            title="${escapeHtml(title)}">

                            🎬 ${escapeHtml(
                                loading
                                ? "A atualizar..."
                                : truncate(title,45)
                            )}

                        </div>


                        <button
                            class="btn-atualizar"
                            data-update="${i}">

                            🔄 Atualizar

                        </button>


                        <a
                            class="btn-youtube"
                            href="${youtubeWatchUrl(videoId)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            ▶️ YouTube

                        </a>

                    </div>


                    ${
                        error
                        ?
                        `
                        <div class="error-msg">
                            ⚠️ ${escapeHtml(error)}
                        </div>
                        `
                        :
                        ""
                    }

                </div>

            </article>

        `;

    }


    grid.innerHTML=html;


    /*
       Os eventos são registados depois
       de criar os cards.
    */

    document
        .querySelectorAll(".btn-atualizar")
        .forEach(button=>{

            button.addEventListener("click",function(){

                const index=
                    Number(this.dataset.update);

                updateSingleCard(index);

            });

        });

}


/* =========================================================
   ATUALIZAR UM CARD
========================================================= */

function updateSingleCard(index){

    if(
        index<0 ||
        index>=currentVideos.length
    ){
        return;
    }


    /*
       Aqui não tentamos fazer uma pesquisa
       falsa no YouTube.

       O vídeo continua válido.

       O botão força a reconstrução do iframe.
    */

    const old=currentVideos[index];

    currentVideos[index]={

        ...old,

        loading:true,

        error:null

    };

    renderAllCards();


    setTimeout(()=>{

        currentVideos[index]={

            ...old,

            loading:false,

            error:null

        };

        renderAllCards();

    },500);

}


/* =========================================================
   ATUALIZAR TODOS
========================================================= */

const refreshButton=
    document.getElementById("refreshAllBtn");


if(refreshButton){

    refreshButton.addEventListener("click",async()=>{

        refreshButton.disabled=true;

        refreshButton.textContent=
            "⏳ A atualizar vídeos...";


        for(
            let i=0;
            i<currentVideos.length;
            i++
        ){

            updateSingleCard(i);

            await new Promise(
                resolve=>setTimeout(resolve,120)
            );

        }


        setTimeout(()=>{

            refreshButton.disabled=false;

            refreshButton.textContent=
                "🔄 ATUALIZAR VÍDEOS";

        },800);

    });

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

function init(){

    renderAllCards();

    console.log(
        "♈ App Áries iniciado."
    );

    console.log(
        "▶️ Player YouTube configurado."
    );

}


/* =========================================================
   DOM READY
========================================================= */

if(document.readyState==="loading"){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}
else{

    init();

}

</script>
